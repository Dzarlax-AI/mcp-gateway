name: CI
on:
  push:
    branches: [main, security/2026-10-25-remediation]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_PASSWORD: synthetic-ci-postgres-password
          POSTGRES_DB: store_contract
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      acl:
        image: postgres:17.11-alpine
        env:
          POSTGRES_PASSWORD: synthetic-ci-postgres-password
          POSTGRES_DB: acl_contract
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      clientkeys:
        image: postgres:17.11-alpine
        env:
          POSTGRES_PASSWORD: synthetic-ci-postgres-password
          POSTGRES_DB: client_key_contract
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      catalog:
        image: postgres:17.11-alpine
        env:
          POSTGRES_PASSWORD: synthetic-ci-postgres-password
          POSTGRES_DB: catalog_session
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      readbatch:
        image: postgres:17.11-alpine
        env:
          POSTGRES_PASSWORD: synthetic-ci-postgres-password
          POSTGRES_DB: read_batch_contract
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      connector:
        image: postgres:17.11-alpine
        env:
          POSTGRES_PASSWORD: synthetic-ci-postgres-password
          POSTGRES_DB: connector_contract
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      rotation:
        image: postgres:17.11-alpine
        env:
          POSTGRES_PASSWORD: synthetic-ci-rotation-password
          POSTGRES_DB: rotation_contract
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
          --label purpose=gateway-rotation-synthetic
        # Aggressive logging is separately exercised in the local rehearsal.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Create isolated classification contract databases
        env:
          CLASSIFIED_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$CLASSIFIED_TEST_POSTGRES_CONTAINER" createdb -U postgres operation_contract
          docker exec "$CLASSIFIED_TEST_POSTGRES_CONTAINER" createdb -U postgres management_contract
      - run: go vet ./...
      - run: go test -race ./...
        env:
          TEST_OPERATION_POSTGRES_DSN: postgres://postgres:synthetic-ci-postgres-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/operation_contract?sslmode=disable
          TEST_MANAGEMENT_POSTGRES_DSN: postgres://postgres:synthetic-ci-postgres-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/management_contract?sslmode=disable
          TEST_ACL_POSTGRES_DSN: postgres://postgres:synthetic-ci-postgres-password@127.0.0.1:${{ job.services.acl.ports[5432] }}/acl_contract?sslmode=disable
          TEST_POSTGRES_DSN: postgres://postgres:synthetic-ci-postgres-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/store_contract?sslmode=disable
          TEST_CLIENT_KEYS_POSTGRES_DSN: postgres://postgres:synthetic-ci-postgres-password@127.0.0.1:${{ job.services.clientkeys.ports[5432] }}/client_key_contract?sslmode=disable
          TEST_CATALOG_POSTGRES_DSN: postgres://postgres:synthetic-ci-postgres-password@127.0.0.1:${{ job.services.catalog.ports[5432] }}/catalog_session?sslmode=disable
          TEST_READ_BATCH_POSTGRES_DSN: postgres://postgres:synthetic-ci-postgres-password@127.0.0.1:${{ job.services.readbatch.ports[5432] }}/read_batch_contract?sslmode=disable
          TEST_CONNECTOR_POSTGRES_DSN: postgres://postgres:synthetic-ci-postgres-password@127.0.0.1:${{ job.services.connector.ports[5432] }}/connector_contract?sslmode=disable
          TEST_ROTATION_POSTGRES_DSN: postgres://postgres:synthetic-ci-rotation-password@127.0.0.1:${{ job.services.rotation.ports[5432] }}/rotation_contract?sslmode=disable
      - run: go build ./cmd/...
      - name: Rehearse secret rotation on isolated PostgreSQL
        run: |
          go build -o /tmp/gateway-rotation-registry ./cmd/registry
          go build -o /tmp/gateway-rotation-server ./cmd/mcp-gateway
          go build -o /tmp/gateway-rotation-fixture scripts/rotation_fixture.go
          python3 -m unittest discover -s scripts -p 'test_rotate_gateway_secrets.py' -v
        env:
          TEST_ROTATION_REHEARSAL_ADMIN_URL: postgres://postgres:synthetic-ci-rotation-password@127.0.0.1:${{ job.services.rotation.ports[5432] }}/rotation_contract?sslmode=disable
          TEST_ROTATION_REHEARSAL_CONTAINER: ${{ job.services.rotation.id }}
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: node scripts/test_connection_actions.cjs
      - run: node scripts/test_permission_actions.cjs
  image:
    name: Build and publish container image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: true
    env:
      IMAGE: ghcr.io/dzarlax-ai/mcp-gateway
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build linux/amd64 image
        run: >-
          docker build --platform linux/amd64 --tag mcp-gateway:ci
          --label "org.opencontainers.image.source=https://github.com/Dzarlax-AI/mcp-gateway"
          --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - name: Check non-root runtime
        run: test "$(docker image inspect mcp-gateway:ci --format '{{.Config.User}}')" = '65532:65532'
      - name: Prepare private deployment artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/security/2026-10-25-remediation') && github.repository == 'Dzarlax-AI/mcp-gateway'
        run: docker save mcp-gateway:ci | gzip > mcp-gateway-image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/security/2026-10-25-remediation') && github.repository == 'Dzarlax-AI/mcp-gateway'
        with:
          name: mcp-gateway-image-${{ github.sha }}
          path: mcp-gateway-image.tar.gz
          retention-days: 1
          if-no-files-found: error
      - name: Sign in to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/security/2026-10-25-remediation') && github.repository == 'Dzarlax-AI/mcp-gateway'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish immutable commit image and verify private visibility
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/security/2026-10-25-remediation') && github.repository == 'Dzarlax-AI/mcp-gateway'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker tag mcp-gateway:ci "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_SHA"
          visibility=$(gh api orgs/Dzarlax-AI/packages/container/mcp-gateway --jq '.visibility')
          test "$visibility" = private
      - name: Publish latest image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Dzarlax-AI/mcp-gateway'
        run: |
          docker tag mcp-gateway:ci "$IMAGE:latest"
          docker push "$IMAGE:latest"
      - name: Sign out of GHCR
        if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/security/2026-10-25-remediation') && github.repository == 'Dzarlax-AI/mcp-gateway'
        run: docker logout ghcr.io
